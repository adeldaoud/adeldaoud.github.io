<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Georgia, 'Source Serif Pro', serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D1F25"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="15" fill="#6b6d73" font-style="italic">From pixels to poverty</text>

  <!-- Satellite tile (left) -->
  <text x="130" y="80" text-anchor="middle" font-size="15" fill="#1D1F25">Satellite imagery</text>
  <g>
    <rect x="40" y="95" width="45" height="45" fill="#6e7f4f"/>
    <rect x="85" y="95" width="45" height="45" fill="#8a9a5b"/>
    <rect x="130" y="95" width="45" height="45" fill="#b6a06a"/>
    <rect x="175" y="95" width="45" height="45" fill="#7d8c5c"/>
    <rect x="40" y="140" width="45" height="45" fill="#9aa86b"/>
    <rect x="85" y="140" width="45" height="45" fill="#857a55"/>
    <rect x="130" y="140" width="45" height="45" fill="#6e7f4f"/>
    <rect x="175" y="140" width="45" height="45" fill="#a89c6a"/>
    <rect x="40" y="185" width="45" height="45" fill="#7d8c5c"/>
    <rect x="85" y="185" width="45" height="45" fill="#b6a06a"/>
    <rect x="130" y="185" width="45" height="45" fill="#8a9a5b"/>
    <rect x="175" y="185" width="45" height="45" fill="#6e7f4f"/>
    <rect x="40" y="230" width="45" height="45" fill="#9aa86b"/>
    <rect x="85" y="230" width="45" height="45" fill="#6e7f4f"/>
    <rect x="130" y="230" width="45" height="45" fill="#a89c6a"/>
    <rect x="175" y="230" width="45" height="45" fill="#857a55"/>
    <rect x="40" y="95" width="180" height="180" fill="none" stroke="#C9C5C2" stroke-width="1.5"/>
  </g>

  <!-- Arrow + model -->
  <line x1="245" y1="185" x2="515" y2="185" stroke="#1D1F25" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="305" y="160" width="150" height="50" rx="8" fill="#F4F1EF" stroke="#C26148" stroke-width="2"/>
  <text x="380" y="190" text-anchor="middle" font-size="15" fill="#1D1F25">deep learning</text>

  <!-- Poverty heatmap (right) -->
  <text x="650" y="80" text-anchor="middle" font-size="15" fill="#1D1F25">Estimated wealth</text>
  <g>
    <rect x="560" y="95" width="45" height="45" fill="#EAD9D2"/>
    <rect x="605" y="95" width="45" height="45" fill="#D89C89"/>
    <rect x="650" y="95" width="45" height="45" fill="#A84B34"/>
    <rect x="695" y="95" width="45" height="45" fill="#C26148"/>
    <rect x="560" y="140" width="45" height="45" fill="#D89C89"/>
    <rect x="605" y="140" width="45" height="45" fill="#A84B34"/>
    <rect x="650" y="140" width="45" height="45" fill="#C26148"/>
    <rect x="695" y="140" width="45" height="45" fill="#E3C0B4"/>
    <rect x="560" y="185" width="45" height="45" fill="#C26148"/>
    <rect x="605" y="185" width="45" height="45" fill="#EAD9D2"/>
    <rect x="650" y="185" width="45" height="45" fill="#D89C89"/>
    <rect x="695" y="185" width="45" height="45" fill="#A84B34"/>
    <rect x="560" y="230" width="45" height="45" fill="#E3C0B4"/>
    <rect x="605" y="230" width="45" height="45" fill="#C26148"/>
    <rect x="650" y="230" width="45" height="45" fill="#EAD9D2"/>
    <rect x="695" y="230" width="45" height="45" fill="#D89C89"/>
    <rect x="560" y="95" width="180" height="180" fill="none" stroke="#C9C5C2" stroke-width="1.5"/>
  </g>

  <!-- Legend -->
  <text x="560" y="300" font-size="12" fill="#6b6d73">poorer</text>
  <rect x="612" y="290" width="20" height="12" fill="#EAD9D2"/>
  <rect x="632" y="290" width="20" height="12" fill="#D89C89"/>
  <rect x="652" y="290" width="20" height="12" fill="#C26148"/>
  <rect x="672" y="290" width="20" height="12" fill="#A84B34"/>
  <text x="700" y="300" font-size="12" fill="#6b6d73">richer</text>
</svg>
