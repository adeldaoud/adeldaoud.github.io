<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Georgia, 'Source Serif Pro', serif">
  <text x="60" y="40" font-size="15" fill="#6b6d73" font-style="italic">The average hides the story</text>

  <!-- Density curve filled to baseline -->
  <path d="M90,250 C 260,248 300,100 430,92 C 560,100 600,248 700,250 L90,250 Z"
        fill="#E3C0B4" fill-opacity="0.55" stroke="#C26148" stroke-width="2"/>

  <!-- Baseline axis -->
  <line x1="70" y1="250" x2="715" y2="250" stroke="#1D1F25" stroke-width="1.5"/>

  <!-- Zero line -->
  <line x1="320" y1="250" x2="320" y2="150" stroke="#6b6d73" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="320" y="270" text-anchor="middle" font-size="13" fill="#6b6d73">0</text>

  <!-- Mean line -->
  <line x1="430" y1="250" x2="430" y2="88" stroke="#1D1F25" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="430" y="80" text-anchor="middle" font-size="13" fill="#1D1F25">average effect</text>

  <!-- Region labels -->
  <text x="200" y="210" text-anchor="middle" font-size="13" fill="#6b6d73">harmed</text>
  <text x="585" y="210" text-anchor="middle" font-size="13" fill="#6b6d73">helped</text>

  <!-- X axis label -->
  <text x="392" y="300" text-anchor="middle" font-size="14" fill="#1D1F25">Individual treatment effect</text>
</svg>
