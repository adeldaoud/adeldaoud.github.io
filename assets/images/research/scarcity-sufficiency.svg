<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="Georgia, 'Source Serif Pro', serif">
  <text x="80" y="45" font-size="15" fill="#6b6d73" font-style="italic">Three relations between wants and resources</text>

  <!-- Sufficiency band -->
  <rect x="300" y="85" width="160" height="50" rx="6" fill="#F0DBD3" stroke="#C26148" stroke-width="1.5"/>

  <!-- Axis -->
  <line x1="80" y1="110" x2="680" y2="110" stroke="#1D1F25" stroke-width="1.8"/>

  <!-- Ticks / nodes -->
  <circle cx="120" cy="110" r="7" fill="#1D1F25"/>
  <circle cx="380" cy="110" r="8" fill="#C26148"/>
  <circle cx="640" cy="110" r="7" fill="#1D1F25"/>

  <!-- Labels -->
  <text x="120" y="160" text-anchor="middle" font-size="16" fill="#1D1F25">Scarcity</text>
  <text x="120" y="180" text-anchor="middle" font-size="12" fill="#6b6d73">wants &gt; resources</text>

  <text x="380" y="160" text-anchor="middle" font-size="16" fill="#1D1F25">Sufficiency</text>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#6b6d73">wants &#8776; resources</text>

  <text x="640" y="160" text-anchor="middle" font-size="16" fill="#1D1F25">Abundance</text>
  <text x="640" y="180" text-anchor="middle" font-size="12" fill="#6b6d73">wants &lt; resources</text>
</svg>
